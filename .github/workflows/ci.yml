name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: PHP ${{ matrix.php-version }} + Symfony ${{ matrix.symfony-version }}${{ matrix.dependency-version == 'lowest' && ' lowest' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Symfony 7.4 LTS on the lowest supported PHP, resolving the lowest allowed dependencies.
          - php-version: '8.4'
            symfony-version: 7.4.*
            dependency-version: lowest
          - php-version: '8.4'
            symfony-version: 8.0.*
          - php-version: '8.5'
            symfony-version: 7.4.*
          - php-version: '8.5'
            symfony-version: 8.0.*
    env:
      # symfony/flex (installed as a global tool below) reads SYMFONY_REQUIRE and forces every
      # symfony/* package to this version during the Composer resolution.
      SYMFONY_REQUIRE: ${{ matrix.symfony-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ctype, dom
          coverage: none
          tools: flex
      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.dependency-version == 'lowest' && 'lowest' || 'highest' }}
          composer-options: --prefer-dist
          custom-cache-suffix: ${{ matrix.symfony-version }}
      - name: PHPUnit
        run: vendor/bin/phpunit

  php-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: ctype, dom
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest
          composer-options: --prefer-dist
      - name: PHPStan
        run: vendor/bin/phpstan analyse
      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Rector
        run: vendor/bin/rector process --dry-run
      - name: Analyse Composer dependencies
        run: vendor/bin/composer-dependency-analyser

  format:
    name: Prettier format check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run format:check
